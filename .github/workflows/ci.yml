name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-ci:
    name: Fast Integrity CI
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Lean and Lake
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formalization
          test: false

      - name: Verify Manifest Integrity
        run: |
          cd formalization
          python3 verify_manifest.py

      - name: Lake Environment Check
        run: |
          cd formalization
          lake exe cache get
          lake build

  full-rebuild-gate:
    name: Full Source Rebuild & Axiom Replay Gate
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Lean and Lake
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formalization
          test: false

      - name: Verify Manifest Integrity
        run: |
          cd formalization
          python3 verify_manifest.py

      - name: Lake Build Base
        run: |
          cd formalization
          lake exe cache get
          lake build

      - name: Full Source Rebuild (Memory-Aware DAG Rebuild)
        run: |
          cd formalization
          python3 rebuild.py --full --clean --jobs 3 --memory-mb 3072 --retry-memory-mb 8192

      - name: Replay & Kernel Axiom Audit
        run: |
          cd formalization
          bash replay.sh
